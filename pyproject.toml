[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dutyrota"
version = "0.1.0"
description = "值日轮值表生成器：名单均衡轮转，输出可打印的 A4 值日表"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "teacher", "classroom", "rota", "schedule", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]

[project.scripts]
dutyrota = "dutyrota.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/dutyrota"
Source = "https://github.com/eastyou/dutyrota"

[tool.setuptools]
packages = ["dutyrota"]
